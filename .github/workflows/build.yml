name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify privacy transform and app
        run: |
          ./gradlew -p buildSrc test --no-daemon
          ./gradlew assembleDebug lintDebug testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
            buildSrc/build/reports/tests/test/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: LumeGallery-development-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
