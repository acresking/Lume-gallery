plugins { id 'com.android.application' }
android {
 namespace 'il.luma.gallery'
 compileSdk 35
 defaultConfig { applicationId 'il.luma.gallery'; minSdk 30; targetSdk 35; versionCode 9; versionName '9.0.0' }
 signingConfigs { release {
  def keyPath=System.getenv('LUME_KEYSTORE_PATH')
  if(keyPath){storeFile file(keyPath);storePassword System.getenv('LUME_STORE_PASSWORD');keyAlias System.getenv('LUME_KEY_ALIAS');keyPassword System.getenv('LUME_KEY_PASSWORD')}
 } }
 buildTypes { release { debuggable false; signingConfig signingConfigs.release } }
 testOptions { unitTests.includeAndroidResources = true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'
 implementation 'androidx.exifinterface:exifinterface:1.3.7'
 implementation 'com.google.mediapipe:tasks-vision:0.10.32'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
 implementation 'androidx.recyclerview:recyclerview:1.3.2'
 implementation 'androidx.viewpager2:viewpager2:1.1.0'
 implementation 'androidx.core:core:1.13.1'
 implementation 'androidx.media3:media3-transformer:1.5.1'
 implementation 'androidx.media3:media3-effect:1.5.1'
}

androidComponents { onVariants(selector().all()) { variant ->
 variant.instrumentation.transformClassesWith(com.lume.build.NoTelemetryFactory,
     com.android.build.api.instrumentation.InstrumentationScope.ALL) { }
} }
